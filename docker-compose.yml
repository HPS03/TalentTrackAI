# One command runs the whole platform:  docker compose up --build
# Then open http://localhost:3000  (API docs: http://localhost:8080/swagger-ui.html)

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: talenttrack
      MYSQL_USER: ${DB_USERNAME:-talenttrack}
      MYSQL_PASSWORD: ${DB_PASSWORD:-talenttrack}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3307:3306"   # host port 3307 so it doesn't clash with a local MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/talenttrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-talenttrack}
      DB_PASSWORD: ${DB_PASSWORD:-talenttrack}
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-0123456789abcdef}
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@talenttrack.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "8080:8080"
    volumes:
      - resumes:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  mysql-data:
  resumes:
