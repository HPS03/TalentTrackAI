spring:
  application:
    name: talenttrack-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/talenttrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none          # schema is owned by Flyway migrations
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

app:
  jwt:
    # Must be at least 32 characters. ALWAYS override in production via JWT_SECRET.
    secret: ${JWT_SECRET:change-me-talenttrack-dev-secret-key-please-override-0123456789}
    access-token-minutes: ${JWT_ACCESS_MINUTES:60}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@talenttrack.ai}
    admin-password: ${ADMIN_PASSWORD:Admin@123}
    demo-data: ${SEED_DEMO_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
